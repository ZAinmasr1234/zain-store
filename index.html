<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAIN STORE | زين ستور</title>
    <style>
        /* التنسيق البصري الاحترافي */
        body {
            margin: 0;
            padding: 0;
            background: #010816;
            background: radial-gradient(circle, #0a2e5c 0%, #010816 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            min-height: 100vh;
        }

        header {
            padding: 25px 10px;
            border-bottom: 2px solid #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }

        .logo {
            font-size: 45px;
            font-weight: bold;
            color: #00f2ff;
            text-shadow: 0 0 10px #00f2ff;
            margin: 0;
        }

        /* ختم الاعتماد الرسمي */
        .official-badge {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
            padding: 8px 15px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
            max-width: 450px;
            margin: auto;
        }

        .price-list {
            margin-top: 10px;
        }

        .card {
            background: rgba(0, 242, 255, 0.08);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 12px;
            padding: 12px 18px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }
        .card:hover { transform: scale(1.02); background: rgba(0, 242, 255, 0.15); }

        .jewels { font-weight: bold; font-size: 16px; }
        .price { color: #f1c40f; font-weight: bold; }

        .order-form {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #00f2ff;
            background: #000;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .pay-info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px dashed #f1c40f;
            color: #f1c40f;
            font-size: 14px;
        }

        .btn-send {
            background: #2ecc71;
            color: white;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: 0.2s;
        }
        .btn-send:active { transform: scale(0.98); }

        footer {
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.7;
            padding-bottom: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">ZAIN STORE</h1>
        <div class="official-badge">
            🛡️ معتمد من موقع شحن جارينا الرسمي
        </div>
    </header>

    <div class="container">
        <div class="price-list">
            <div class="card"><span class="jewels">💎 50 جوهرة</span> <span class="price">35 ج</span></div>
            <div class="card"><span class="jewels">💎 100 جوهرة</span> <span class="price">60 ج</span></div>
            <div class="card"><span class="jewels">💎 210 جوهرة</span> <span class="price">115 ج</span></div>
            <div class="card"><span class="jewels">💎 310 جوهرة</span> <span class="price">160 ج</span></div>
            <div class="card"><span class="jewels">💎 520 جوهرة</span> <span class="price">260 ج</span></div>
            <div class="card"><span class="jewels">💎 1060 جوهرة</span> <span class="price">515 ج</span></div>
            <div class="card"><span class="jewels">🚀 2200 جوهرة</span> <span class="price">1100 ج</span></div>
        </div>

        <div class="order-form">
            <h3 style="margin-top:0; color:#00f2ff;">طلب شحن جديد 🎮</h3>
            <input type="number" id="idPlayer" placeholder="أدخل الـ ID الخاص بك">
            
            <select id="packChosen">
                <option value="50 جوهرة">50 جوهرة - 35 جنيه</option>
                <option value="100 جوهرة">100 جوهرة - 60 جنيه</option>
                <option value="210 جوهرة">210 جوهرة - 115 جنيه</option>
                <option value="310 جوهرة">310 جوهرة - 160 جنيه</option>
                <option value="520 جوهرة">520 جوهرة - 260 جنيه</option>
                <option value="1060 جوهرة">1060 جوهرة - 515 جنيه</option>
                <option value="2200 جوهرة">2200 جوهرة - 1100 جنيه</option>
            </select>

            <div class="pay-info">
                📌 فودافون كاش: <strong>01021431977</strong>
            </div>

            <button class="btn-send" onclick="sendToWhatsApp()">إرسال الطلب (واتساب) ✅</button>
        </div>
    </div>

    <footer>
        ثقة • أمان • سرعة | ZAIN STORE 2026
    </footer>

    <script>
        function sendToWhatsApp() {
            const id = document.getElementById('idPlayer').value;
            const pack = document.getElementById('packChosen').value;
            const phone = "201021431977";

            if (id === "") {
                alert("برجاء إدخال الـ ID أولاً");
                return;
            }

            const msg = `مرحباً زين ستور 🎮%0Aأريد شحن: ${pack}%0Aالـ ID: ${id}%0Aلقد قمت بالتحويل بنجاح ✅`;
            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
        }
    </script>

</body>
</html>
