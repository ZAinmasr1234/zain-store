<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zain Data Store | متجر زين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0b0e14;
            --card-bg: #161b22;
            --text: #e6edf3;
            --accent: #f39c12;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            background-image: radial-gradient(circle at 50% 50%, #1a1f29 0%, #0b0e14 100%);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header i {
            font-size: 3rem;
            color: var(--primary);
            filter: drop-shadow(0 0 10px var(--primary));
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 10px 0;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 242, 254, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            margin: 25px 0 15px 0;
            border-right: 4px solid var(--primary);
            font-weight: bold;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .item-card i {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: block;
            color: var(--secondary);
        }

        .item-card:hover {
            border-color: var(--primary);
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
        }

        .item-card.selected {
            border-color: var(--primary);
            background: rgba(0, 242, 254, 0.08);
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .item-card.selected::after {
            content: "\f058";
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
            position: absolute;
            top: 10px;
            right: 10px;
            color: var(--primary);
        }

        .item-card input { display: none; }

        .price-tag {
            display: block;
            color: var(--primary);
            font-weight: bold;
            margin-top: 8px;
            font-size: 0.95rem;
        }

        /* ستايل الملحوظة الجديدة */
        .price-note {
            background: rgba(243, 156, 18, 0.1);
            border: 1px dashed var(--accent);
            color: var(--accent);
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .btn-send {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .fast-reply {
            display: block;
            text-align: center;
            font-size: 0.85rem;
            margin-top: 10px;
            color: #8b949e;
        }

        .support-section {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .support-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: 0.3s;
        }

        .wa { background: #25d366; }
        .tg { background: #0088cc; }
        .support-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        #error-toast {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4b2b;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="error-toast">⚠️ يرجى اختيار خدمة واحدة على الأقل!</div>

    <div class="container">
        <div class="header">
            <i class="fas fa-database"></i>
            <h1>Zain Data Store</h1>
            <p style="color: #8b949e; font-size: 0.9rem;">أسرع خدمات سحب البيانات والخدمات الحكومية</p>
        </div>

        <div class="section-title">
            <i class="fas fa-search-plus"></i> خدمات سحب الداتا
        </div>
        <div class="card-grid">
            <label class="item-card">
                <input type="checkbox" name="service" value="سحب داتا 010" data-price="45">
                <i class="fas fa-file-invoice"></i>
                <span>سحب داتا 010</span>
                <span class="price-tag">45 ج</span>
            </label>
            <label class="item-card">
                <input type="checkbox" name="service" value="سحب داتا 012" data-price="15">
                <i class="fas fa-file-invoice"></i>
                <span>سحب داتا 012</span>
                <span class="price-tag">15 ج</span>
            </label>
            <label class="item-card">
                <input type="checkbox" name="service" value="سحب داتا 015" data-price="40">
                <i class="fas fa-file-invoice"></i>
                <span>سحب داتا 015</span>
                <span class="price-tag">40 ج</span>
            </label>
        </div>

        <div class="section-title">
            <i class="fas fa-id-card"></i> الخدمات الحكومية
        </div>
        <div class="card-grid">
            <label class="item-card">
                <input type="checkbox" name="service" value="شهادة ميلاد أول مرة" data-price="230">
                <i class="fas fa-baby"></i>
                <span>ميلاد (أول مرة)</span>
                <span class="price-tag">230 ج</span>
            </label>
            <label class="item-card">
                <input type="checkbox" name="service" value="شهادة ميلاد ثاني مرة" data-price="200">
                <i class="fas fa-certificate"></i>
                <span>ميلاد (ثاني مرة)</span>
                <span class="price-tag">200 ج</span>
            </label>
            <label class="item-card">
                <input type="checkbox" name="service" value="قسيمة (زواج/طلاق)" data-price="240">
                <i class="fas fa-ring"></i>
                <span>قسيمة زواج/طلاق</span>
                <span class="price-tag">240 ج</span>
            </label>
            <label class="item-card">
                <input type="checkbox" name="service" value="شهادة وفاة" data-price="240">
                <i class="fas fa-book-dead"></i>
                <span>شهادة وفاة</span>
                <span class="price-tag">240 ج</span>
            </label>
            <label class="item-card">
                <input type="checkbox" name="service" value="قيد عائلي مميكن" data-price="650">
                <i class="fas fa-users"></i>
                <span>قيد عائلي</span>
                <span class="price-tag">650 ج</span>
            </label>
            <label class="item-card">
                <input type="checkbox" name="service" value="صورة سيستم جنائي" data-price="400">
                <i class="fas fa-user-shield"></i>
                <span>سيستم جنائي</span>
                <span class="price-tag">400 ج</span>
            </label>
        </div>

        <div class="price-note">
            ⚠️ قد يزيد المبلغ من 10 لـ 15 جنية على حسب سعر الموظف
        </div>

        <button class="btn-send" onclick="sendOrder()">
            <i class="fab fa-whatsapp"></i> إرسال الطلب الآن
        </button>
        <span class="fast-reply">الرقم 01021431977 للرد السريع والمتابعة ⚡</span>

        <div class="support-section">
            <a href="https://wa.me/201210233693" class="support-btn wa"><i class="fab fa-whatsapp"></i> دعم واتساب (1)</a>
            <a href="https://wa.me/201021431977" class="support-btn wa"><i class="fab fa-whatsapp"></i> دعم واتساب (2)</a>
            <a href="https://t.me/VIP_ZVN" class="support-btn tg"><i class="fab fa-telegram-plane"></i> دعم تليجرام</a>
        </div>
    </div>

    <script>
        document.querySelectorAll('.item-card').forEach(card => {
            card.addEventListener('click', function() {
                this.classList.toggle('selected');
                const chk = this.querySelector('input');
                chk.checked = !chk.checked;
            });
        });

        function sendOrder() {
            const selected = document.querySelectorAll('input[name="service"]:checked');
            
            if (selected.length === 0) {
                const toast = document.getElementById('error-toast');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 3000);
                return;
            }

            let text = "طلب جديد من Zain Store ⚡\n\nالخدمات المختارة:\n";
            let total = 0;

            selected.forEach(item => {
                text += `• ${item.value} - ${item.getAttribute('data-price')} ج\n`;
                total += parseInt(item.getAttribute('data-price'));
            });

            text += `\n💰 الإجمالي الأساسي: ${total} جنيه\n⚠️ (قد تضاف رسوم موظف 10-15 ج)\n🚀 التسليم خلال يومين`;

            const url = `https://wa.me/201021431977?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
