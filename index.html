<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAIN AL WEB - شحن جواهر Free Fire</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --gold: #FFD700;
            --gold-light: #FFE55C;
            --gold-dark: #D4A000;
            --orange: #FF6B00;
            --bg: #07070F;
            --bg-card: #0D0D1A;
            --bg-elevated: #12121F;
            --border: rgba(255,255,255,0.06);
            --text: #FFFFFF;
            --text-muted: rgba(255,255,255,0.45);
            --text-dim: rgba(255,255,255,0.25);
            --success: #00E676;
            --accent: #FF2D55;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .bg-animated::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,107,0,0.08) 0%, transparent 70%);
            animation: float 8s ease-in-out infinite;
        }
        
        .bg-animated::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,215,0,0.06) 0%, transparent 70%);
            animation: float 10s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-30px, 20px) scale(1.1); }
            66% { transform: translate(20px, -30px) scale(0.95); }
        }
        
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7,7,15,0.85);
            backdrop-filter: blur(20px) saturate(1.5);
            -webkit-backdrop-filter: blur(20px) saturate(1.5);
            border-bottom: 1px solid var(--border);
            padding: 0;
        }
        
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            max-width: 480px;
            margin: 0 auto;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .brand-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--gold), var(--orange));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 25px rgba(255,107,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
        }
        
        .brand-logo::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        
        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        
        .brand-text span {
            font-size: 0.62rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            font-weight: 600;
        }
        
        .menu-btn {
            width: 44px;
            height: 44px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .menu-btn:hover {
            border-color: rgba(255,215,0,0.3);
            box-shadow: 0 0 20px rgba(255,215,0,0.1);
        }
        
        .menu-btn span {
            display: block;
            width: 18px;
            height: 2.5px;
            background: linear-gradient(90deg, var(--gold), var(--orange));
            border-radius: 3px;
            transition: all 0.3s;
        }
        
        .menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        
        .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }
        
        .menu-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background: linear-gradient(180deg, #0A0A18 0%, #111125 100%);
            z-index: 300;
            transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            border-right: 1px solid rgba(255,215,0,0.08);
        }
        
        .sidebar.active {
            transform: translateX(0);
        }
        
        .sidebar-header {
            padding: 30px 24px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sidebar-brand .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--gold), var(--orange));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
