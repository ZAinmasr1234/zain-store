<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAIN STORE | العصر الذهبي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --primary-dim: rgba(0, 242, 255, 0.1);
            --gold: #f1c40f;
            --gold-glow: rgba(241, 196, 15, 0.4);
            --bg-dark: #000103;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(0, 242, 255, 0.15);
        }

        body { 
            margin: 0; padding: 0; background-color: var(--bg-dark);
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px; font-family: 'Cairo', sans-serif; color: white; overflow-x: hidden;
            animation: backgroundPan 60s linear infinite;
        }

        @keyframes backgroundPan { from { background-position: 0 0; } to { background-position: 1000px 1000px; } }
        body.locked { overflow: hidden; }

        #intro-screen { position: fixed; inset: 0; background: #000; z-index: 1000000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 1s; }
        .typing-container { font-family: 'Orbitron', sans-serif; font-size: clamp(40px, 10vw, 80px); font-weight: 900; background: linear-gradient(90deg, #fff, var(--gold), #fff); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200%; }
        .neon-active { animation: shine 3s linear infinite, neonPulse 2s infinite; }
        @keyframes shine { to { background-position: 200%; } }
        @keyframes neonPulse { 0%, 100% { text-shadow: 0 0 20px var(--gold); } 50% { text-shadow: 0 0 40px var(--gold); } }

        /* القائمة المخصصة الفخمة */
        .custom-select-wrapper { position: relative; width: 100%; margin-bottom: 20px; }
        .select-styled {
            background: rgba(0, 0, 0, 0.9); border: 2px solid var(--primary);
            box-shadow: 0 0 15px var(--primary-dim); color: var(--primary);
            font-weight: 900; padding: 20px; border-radius: 15px; cursor: pointer;
            text-align: center; display: flex; justify-content: center; align-items: center;
        }
        .select-styled:after { content: '▼'; margin-right: 15px; font-size: 12px; }
        .select-options {
            position: absolute; top: 105%; right: 0; left: 0;
            background: #080a0f; border: 2px solid var(--primary);
            border-radius: 15px; z-index: 999; display: none;
            overflow: hidden; box-shadow: 0 10px 40px rgba(0, 242, 255, 0.3);
            animation: fadeIn 0.3s ease;
        }
        .select-options div { padding: 20px; text-align: center; border-bottom: 1px solid rgba(0, 242, 255, 0.1); transition: 0.3s; font-weight: 700; color: white; cursor: pointer; }
        .select-options div:hover { background: var(--primary); color: black; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .container { padding: 20px; max-width: 900px; margin: 0 auto; padding-bottom: 200px; }
        .order-form { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 25px; backdrop-filter: blur(5px); }
        input { width: 100%; padding: 18px; border-radius: 15px; background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; font-family: 'Cairo'; font-weight: 700; box-sizing: border-box; }
        
        .price-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .price-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 25px 15px; text-align: center; cursor: pointer; transition: 0.4s; }
        .price-card:hover { border-color: var(--gold); background: rgba(241, 196, 15, 0.05); transform: translateY(-5px); }
        .price-card.active { border-color: var(--gold); background: rgba(241, 196, 15, 0.1); box-shadow: 0 0 20px var(--gold-glow); }

        .confirm-btn { width: 100%; padding: 25px; background: linear-gradient(45deg, #f1c40f, #d4ac0d); border: none; border-radius: 20px; font-weight: 900; font-size: 22px; cursor: pointer; color: black; }
        
        .support-float { position: fixed; bottom: 30px; left: 30px; background: #000; border: 2px solid var(--primary); padding: 15px 30px; border-radius: 50px; cursor: pointer; z-index: 4000; font-weight: 900; color: var(--primary); animation: pBlue 2s infinite; }
        .go-to-p2 { position: fixed; bottom: 30px; right: 30px; background: #000; border: 2px solid var(--gold); padding: 15px 30px; border-radius: 50px; cursor: pointer; z-index: 4000; font-weight: 900; color: var(--gold); animation: pGold 2s infinite; }
        @keyframes pBlue { 0%, 100% { box-shadow: 0 0 10px var(--primary-dim); } 50% { box-shadow: 0 0 20px var(--primary); } }
        @keyframes pGold { 0%, 100% { box-shadow: 0 0 10px var(--gold-glow); } 50% { box-shadow: 0 0 20px var(--gold); } }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .modal-card { background: #080a0f; border: 2px solid var(--primary); padding: 40px; border-radius: 35px; text-align: center; width: 90%; max-width: 420px; }
    </style>
</head>
<body class="locked">

<div id="zain-alert-overlay" class="modal">
    <div class="modal-card" style="border-color: var(--gold);">
        <div id="alert-icon" style="font-size: 60px;">⚠️</div>
        <h2 id="alert-title" style="color: var(--gold);">تنبيه يا بطل</h2>
        <p id="alert-msg" style="font-size: 18px; line-height: 1.6;"></p>
        <button onclick="closeZainAlert()" style="background: var(--gold); border: none; padding: 15px 40px; border-radius: 10px; font-weight: 900; cursor: pointer;">تمام ✅</button>
    </div>
</div>

<div id="confirm-modal" class="modal">
    <div class="modal-card" style="border-color: var(--primary);">
        <h2 style="color: var(--primary);">تأكيد طلبك يا بطل 🛡️</h2>
        <div id="summary" style="text-align: right; margin: 20px 0; line-height: 2; font-weight: 700; border-right: 3px solid var(--gold); padding-right: 15px;"></div>
        <button onclick="sendOrder()" style="width:100%; background: var(--primary); border: none; padding: 18px; border-radius: 12px; font-weight: 900; cursor: pointer; color: #000;">تأكيد وإرسال 🚀</button>
        <button onclick="document.getElementById('confirm-modal').style.display='none'" style="background:none; border:none; color:#777; margin-top:15px; cursor:pointer;">تعديل الب            </div>
            <div class="item-card gov-opt" onclick="handleCardClick(this)">
                <input type="checkbox" name="service" value="شهادة وفاة" data-price="240">
                <i class="fas fa-book-dead"></i><span>شهادة وفاة</span><span class="price-tag">240 ج</span>
            </div>
            <div class="item-card gov-opt" onclick="handleCardClick(this)">
                <input type="checkbox" name="service" value="قيد عائلي مميكن" data-price="650">
                <i class="fas fa-users"></i><span>قيد عائلي</span><span class="price-tag">650 ج</span>
            </div>
            <div class="item-card gov-opt" onclick="handleCardClick(this)">
                <input type="checkbox" name="service" value="صورة سيستم جنائي" data-price="400">
                <i class="fas fa-user-shield"></i><span>سيستم جنائي</span><span class="price-tag">400 ج</span>
            </div>
        </div>

        <div id="gov-input-box" class="dynamic-input">
            <input type="tel" id="id-input" placeholder="ادخل الرقم القومي المراد السحب عليه" maxlength="14">
        </div>

        <div class="price-note">⚠️ قد يزيد المبلغ من 10 لـ 15 جنية على حسب سعر الموظف</div>

        <button class="btn-send" onclick="sendOrder()">
            <i class="fab fa-whatsapp"></i> إرسال الطلب الآن
        </button>
        <span class="fast-reply">الرقم 01021431977 للرد السريع والمتابعة ⚡</span>

        <div class="support-section">
            <a href="https://wa.me/201210233693" class="support-btn wa"><i class="fab fa-whatsapp"></i> دعم واتساب (1)</a>
            <a href="https://wa.me/201021431977" class="support-btn wa"><i class="fab fa-whatsapp"></i> دعم واتساب (2)</a>
            <a href="https://t.me/VIP_ZVN" class="support-btn tg"><i class="fab fa-telegram-plane"></i> دعم تليجرام</a>
        </div>
    </div>

    <script>
        function showMsg(m) {
            const t = document.getElementById('error-toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3500);
        }

        function handleCardClick(el) {
            el.classList.toggle('selected');
            const chk = el.querySelector('input[type="checkbox"]');
            chk.checked = el.classList.contains('selected');

            updateInputs();
        }

        function updateInputs() {
            const anyData = document.querySelectorAll('.data-opt.selected').length > 0;
            const anyGov = document.querySelectorAll('.gov-opt.selected').length > 0;
            
            document.getElementById('data-input-box').style.display = anyData ? 'block' : 'none';
            document.getElementById('gov-input-box').style.display = anyGov ? 'block' : 'none';
        }

        function sendOrder() {
            const selectedChecks = document.querySelectorAll('input[name="service"]:checked');
            if (selectedChecks.length === 0) return showMsg("⚠️ اختار خدمة واحدة على الأقل يا بطل!");

            let msgDetails = "";
            let total = 0;
            let deliveryTime = "يومين"; 
            let error = null;

            selectedChecks.forEach(input => {
                const card = input.closest('.item-card');
                const price = parseInt(input.getAttribute('data-price'));
                total += price;

                if (card.classList.contains('data-opt')) {
                    deliveryTime = "30 دقيقة";
                    const prefix = input.getAttribute('data-prefix');
                    const phone = document.getElementById('phone-input').value;
                    
                    if (phone.length !== 11 || !phone.startsWith(prefix)) {
                        error = `الرقم الخاص بـ ${input.value} لازم يبدأ بـ ${prefix} ويكون 11 رقم!`;
                    }
                    msgDetails += `• ${input.value} (رقم: ${phone})\n`;
                } else {
                    const idNum = document.getElementById('id-input').value;
                    if (idNum.length !== 14) {
                        error = "الرقم القومي لازم يكون 14 رقم بالظبط!";
                    }
                    msgDetails += `• ${input.value} (قومي: ${idNum})\n`;
                }
            });

            if (error) return showMsg("⚠️ " + error);

            const finalMsg = `طلب جديد Zain Store ⚡\n\nالخدمات المطلوبة:\n${msgDetails}\n💰 الإجمالي: ${total} ج\n⏰ التسليم: خلال ${deliveryTime}\n⚠️ تضاف رسوم موظف (10-15ج) عند التنفيذ`;
            
            window.open(`https://wa.me/201021431977?text=${encodeURIComponent(finalMsg)}`, '_blank');
        }
    </script>
</body>
</html>
